# ─── Netlify Configuration ──────────────────────────────────────────────────
# Love Fusion Predict — Netlify (paid) deployment

[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION  = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# ─── Next.js on Netlify ───────────────────────────────────────────────────────
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Headers ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options      = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy      = "strict-origin-when-cross-origin"
    Permissions-Policy   = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' fonts.googleapis.com;
      img-src 'self' data: blob: res.cloudinary.com *.cloudinary.com drive.google.com lh3.googleusercontent.com;
      font-src 'self' fonts.gstatic.com;
      connect-src 'self';
      frame-ancestors 'none';
    """

# ─── Redirects ────────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/predict"
  status = 302

# ─── Scheduled function: auto-close at entry deadline ─────────────────────────
[functions."scheduled-auto-close"]
  schedule = "0 4 24 10 *"
